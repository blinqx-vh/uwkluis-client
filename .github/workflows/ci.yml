# CI translated from bitbucket-pipelines.yml by MM Guide, 2026-09-04.
#
# Source: 751567812571.dkr.ecr.eu-central-1.amazonaws.com/hypotheekbond/uwkluis-client-development:php-8.2-alpine-20240617134349
# Source steps: composer validate, composer install, phpunit.
#
# Source pulled its image from AWS account 751567812571, which Max Visser
# confirmed on 2026-09-04 is legacy and will never get OIDC. That image supplies
# only the bcmath and intl extensions, established by building and running this
# repo locally on stock php:8.2-alpine. Declaring them here removes the ECR
# dependency entirely: no cross-account access and no image push are needed.
#
# Bitbucket's `default:` pipeline runs on every push to any branch, so `on: push`
# carries no branch filter here. Safe because this repository has single-digit
# branches; the same shape would be wrong on monorepo.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: composer and phpunit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, intl
          tools: composer:v2
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
